server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # This line is critical for React Router:
        # If the file isn't found (e.g. /scan), fallback to index.html
        try_files $uri $uri/ /index.html;
    }

    # Optional: Proxy API requests to backend if we want to avoid CORS issues later
    # location /api/ {
    #     proxy_pass http://backend:8000/;
    # }
}