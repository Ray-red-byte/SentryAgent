version: '3.8'

services:
  # --- BACKEND ---
  backend:
    build: .
    container_name: sentry_backend
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - sentry_workspaces:/app/temp_workspaces
    env_file:
      - .env
    depends_on:
      - chromadb_server
      - db  # <--- Wait for Postgres
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # --- POSTGRESQL (New) ---
  db:
    image: postgres:15-alpine
    container_name: sentry_postgres
    restart: always
    environment:
      - POSTGRES_USER=sentry_user
      - POSTGRES_PASSWORD=sentry_pass
      - POSTGRES_DB=sentry_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- FRONTEND ---
  frontend:
    build: ./frontend
    container_name: sentry_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # --- VECTOR DB ---
  chromadb_server:
    image: chromadb/chroma:latest
    container_name: sentry_chromadb
    ports:
      - "8001:8000"
    volumes:
      - ./chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

volumes:
  sentry_workspaces:
  postgres_data: # <--- Persistent Volume