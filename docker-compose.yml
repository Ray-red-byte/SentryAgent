version: '3.8'

services:
  # --- BACKEND ---
  backend:
    build: .
    container_name: sentry_backend
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - sentry_workspaces:/app/temp_workspaces
      - chroma_model_cache:/root/.cache

    env_file:
      - .env
    depends_on:
      - chromadb_server
      - db
      - redis # <--- Added dependency
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: sh -c "python -m app.core.seed_knowledge && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --reload-exclude '*.pyc'"

  # --- REDIS (New) ---
  redis:
    image: redis:alpine
    container_name: sentry_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes # Persist data to disk

  # --- POSTGRESQL ---
  db:
    image: postgres:15-alpine
    container_name: sentry_postgres
    restart: always
    environment:
      - POSTGRES_USER=sentry_user
      - POSTGRES_PASSWORD=sentry_pass
      - POSTGRES_DB=sentry_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- FRONTEND ---
  frontend:
    build: ./frontend
    container_name: sentry_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # --- VECTOR DB ---
  chromadb_server:
    image: chromadb/chroma:latest
    container_name: sentry_chromadb
    ports:
      - "8001:8000"
    volumes:
      - ./chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

volumes:
  sentry_workspaces:
  postgres_data:
  redis_data: # <--- New Volume
  chroma_model_cache: